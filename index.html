<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Care Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <img src="./images/firelily-logo3.png" alt="FireLily Logo" class="logo">
        <h1>Cat Care Dashboard</h1>
    </header>
    
    <section id="calendar">
        <h2>Cat Care Calendar</h2>
        <input type="date" id="care-date" />
        <button id="add-date">Add to Calendar</button>

        <ul id="calendar-list"></ul>
        <hr>
    </section>

    <section id="tasks">
        <h2>Tasks</h2>
        <ul id="task-list">
            <li><label><input type="checkbox">Feed the cat</label></li>
            <li><label><input type="checkbox">Clean litterbox</label> </li>
            <li><label><input type="checkbox">Play with the cats</label></li>
            <li><label><input type="checkbox">Check water fountain</label></li>
            <li><label><input type="checkbox">Brush cats</label></li>
        </ul>
        <button id="reset-tasks">Reset All</button>
    </section>

    <section id="tracker">
        <h2>Daily Tracker</h2>
        <form>
            <label for="feeding-time">Feeding Time:</label>
            <input type="time" id="feeding-time">
            <button type="submit">Add Feeding Time</button>
        </form>

        <h3>Scheduled Feeding Times</h3>
        <ul id="feeding-times">
            <!-- Feeding times will appear here -->
        </ul>
    </section>

<div class="floating-gif-container">
  <img src="./images/Sticker GIF.gif" alt="Floating Pawprint" class="floating-gif">
</div>

    <footer>
        <p>&copy; 2025 Cat Care Dashboard</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
